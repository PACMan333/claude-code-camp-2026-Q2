<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Logging Monitor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Logging Monitor</a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.path == '/' or request.path.startswith('/sessions') else '' }}">Sessions</a>
      <a href="/errors" class="{{ 'active' if request.path == '/errors' else '' }}">Errors</a>
      <a href="/mud" class="{{ 'active' if request.path == '/mud' else '' }}">MUD Log</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
