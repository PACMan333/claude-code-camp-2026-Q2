services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    # Image runs as a non-root UID by default, which can't write to a
    # freshly-created named volume (root-owned until something chowns it).
    # Running as root keeps this simple for a local learning stack.
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${BOUKENSHA_SESSIONS_DIR:-../../.boukensha/sessions}:/var/log/boukensha/sessions:ro
      - otel-file-storage:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317" # OTLP gRPC (traces, from scripts/session_to_traces.py)
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape target
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    # Pinned (not :latest) — v3.x renamed/restructured top-level config
    # keys (ingester/compactor no longer parse the same way), and 2.x is
    # the stable, well-documented shape this repo's tempo-config.yaml uses.
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  otel-file-storage:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
